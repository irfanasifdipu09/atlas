name: Wake Colab GPU

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions: write-all

jobs:
  launch-colab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & Dependencies
        run: |
          pip install playwright
          playwright install firefox --with-deps

      - name: Write Cookies from Secret
        env:
          COOKIES_DATA: ${{ secrets.COLAB_COOKIES }}
        run: |
          echo "$COOKIES_DATA" > cookies.json

      - name: Execute Cloud Launcher
        run: |
          python launch_cloud.py
